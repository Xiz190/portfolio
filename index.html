<meta charset="utf-8">
<title>Xingchen Zhou Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* ---------- tokens: one warm-white page for the whole site (one look, both themes).
   Projects differ only by one accent colour and their own media; dark work sits in dark frames (.dk) on the page. ---------- */
:root{ color-scheme:light;
  --bg:#fbfaf7; --ink:#1d1c19; --muted:#6a675f; --faint:#74706a; --rule:#e4e0d6; --focus:#3b6fd8;
  /* the dark frame: 3D, sound figures, code */
  --ss-bg:#232220; --studio:#e5e1d9; --panel-ink:#1d1c19; --panel-muted:#5f5b54; --panel-faint:#76726b; --panel-rule:rgba(29,28,25,.12); --studio-ink:#1d1c19; --studio-muted:#5f5b54; --ss-ink:#ece8e0; --ss-muted:#b2aea6; --ss-rule:rgba(236,232,224,.15); --ss-accent:#b9a16b;
  /* project accents on the light page */
  --ss-accent-l:#8c6e2e; --rd-accent:#b4441f; --mu-accent:#c0402c;
  --display:"Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
  --sans:"Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}

*{box-sizing:border-box}
body{--page:var(--bg); background:var(--page); color:var(--ink); font:15px/1.6 var(--sans); padding-inline:clamp(16px,4vw,48px); padding-block:0 64px; transition:background .35s, color .35s}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:3px}
button{font:inherit; color:inherit}
.mono{font-family:var(--mono)}
.wrap{max-width:1180px; margin-inline:auto}

/* ---------- header: small, centred name (after yurisuzuki.com) ---------- */
.site{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--page); transition:background .35s; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding-block:30px 26px; text-transform:uppercase; font-size:13px; letter-spacing:.06em}
.site .name{font-weight:700; font-size:22px; letter-spacing:.03em; text-decoration:none; white-space:nowrap}
nav.top{display:flex; gap:22px; align-items:center}
nav.top.r{justify-content:flex-end}
nav.top a{text-decoration:none; color:var(--muted)} nav.top a:hover, nav.top a[aria-current="page"]{color:var(--ink)}
.snd{display:inline-flex; align-items:center; gap:7px; border:0; background:transparent; padding:0; cursor:pointer; text-transform:uppercase; letter-spacing:.06em; font-size:13px; color:var(--muted)}
.snd .bars{display:inline-flex; gap:2px; align-items:flex-end; height:11px}
.snd .bars i{width:2px; background:currentColor; height:3px; border-radius:1px}
.snd[aria-pressed="true"]{color:var(--ink)}
.snd[aria-pressed="true"] .bars i{animation:eq 1s ease-in-out infinite}
.snd[aria-pressed="true"] .bars i:nth-child(2){animation-delay:-.3s} .snd[aria-pressed="true"] .bars i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

/* ---------- home: who I am in one line, then three covers, each with its name and one sentence always visible ---------- */
.intro{padding:18px 0 34px}
/* 11-19: a line breaks between clauses, never inside one; a clause that does not fit moves down whole */
.cl{display:inline-block}
/* 11-20: on a phone almost no clause fits one line, so whole-clause breaks left single words stranded; let the text flow there */
@media (max-width:560px){ .cl{display:inline} }
.intro-l{margin:0; font:400 clamp(21px,2.4vw,27px)/1.35 var(--display); letter-spacing:-.005em; text-wrap:pretty}
.intro-s{margin:12px 0 0; font-size:14px; color:var(--muted)}
.intro-s a{color:var(--ink)}
.intro-s.wip{margin-top:6px; color:var(--faint)}
.wip-note{font-size:14px; color:var(--w-muted); border-top:1px solid var(--w-rule); border-bottom:1px solid var(--w-rule); padding:10px 0; margin:22px 0!important; max-width:none!important}
.wip-note b{color:var(--w-ink); font-weight:500}
figure.worn{max-width:460px; margin:0}
/* 11-19: the photo and the film side by side; until the full film is shot, a placeholder that links the midterm video */
.worn-row{display:grid; grid-template-columns:minmax(0,460px) minmax(0,1fr); gap:0 16px; margin:0 0 8px}
.worn-row figure.worn{display:contents}   /* photo and caption join the row's grid, so the film box is exactly as tall as the photo */
.worn-row figure.worn img{grid-column:1; grid-row:1; width:100%} .worn-row figcaption{grid-column:1; grid-row:2}
.worn-row .film-slot{grid-column:2; grid-row:1; aspect-ratio:auto; min-height:0; padding:28px}
.film-slot a{display:inline-block; margin-top:14px; font:400 14px var(--sans); color:var(--w-ink); text-decoration:underline; text-underline-offset:3px}
@media (max-width:760px){ .worn-row{grid-template-columns:minmax(0,1fr)} .worn-row .film-slot{grid-column:1; grid-row:3; min-height:180px; margin-top:16px} }
/* a photo in a cover cell: its labels sit on small paper chips so they read over the picture */
.sc-cell:has(img) .tag, .sc-cell:has(img) .hint{background:rgba(251,250,247,.92); color:var(--ink); padding:3px 7px; border-radius:3px; opacity:1}
.sc-cell:has(img) .tag{left:10px; top:10px} .sc-cell:has(img) .hint{right:10px; bottom:10px}
figure.worn img{aspect-ratio:4/5; object-fit:cover; object-position:50% 35%}
.covers{display:flex; flex-direction:column; gap:72px; padding-top:4px}
/* a project with nothing to hear yet: one line under the covers, not an empty frame */
.also{margin:52px 0 0; padding-top:18px; border-top:1px solid var(--rule); font-size:15px; color:var(--muted)}
.also span{color:var(--mu-accent); margin-right:10px}
.also b{color:var(--ink); font-weight:600; margin-right:6px}
.cover{position:relative; display:block; text-decoration:none; color:var(--ink)}
.frame{position:relative; width:100%; aspect-ratio:16/7.2; max-width:100%; overflow:hidden; cursor:pointer; border-radius:6px}
.under{display:grid; grid-template-columns:minmax(0,1fr); justify-items:center; text-align:center; gap:8px; padding:0 0 26px}
.under h2{margin:0; font:400 clamp(30px,3.6vw,46px)/1.1 var(--display); letter-spacing:-.015em; white-space:nowrap}
.under p{margin:0; color:var(--muted); font-size:17px; line-height:1.55}
.under .go{grid-row:3; margin-top:4px; font-size:14px; color:var(--muted); white-space:nowrap; transition:color .2s}
/* 11-20: hover only where there is a pointer; on a phone a tapped cover kept its underline */
.cover:focus-visible .under .go{color:var(--ink)}
@media (hover:hover){ .cover:hover .under .go{color:var(--ink)} .cover:hover h2{text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:1px} }
@media (max-width:560px){ .under h2{white-space:normal} }
.frame .tag{position:absolute; left:16px; top:14px; font:400 13px/1.3 var(--sans); z-index:3}
.frame .hint{position:absolute; right:16px; bottom:12px; font:400 12px var(--sans); z-index:3}
.btn{display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-size:14px; padding:8px 14px; border-radius:2px; border:1px solid var(--rule); background:transparent; cursor:pointer; white-space:nowrap}
.btn:hover{border-color:currentColor}

/* Sound States block: final piece large, midterm + single finger stacked */
.bento{position:absolute; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr; gap:10px; background:var(--bg)}
.cell{position:relative; overflow:hidden; background:transparent}
.cell.big{grid-row:span 2}
.cell .tag{color:var(--studio-ink)}
.cell .ph-note{position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:var(--studio-muted); font:400 12px/1.6 var(--mono); padding:16px}
.cell .ph-note b{display:block; font:500 15px var(--sans); color:var(--studio-ink); letter-spacing:.02em}
.cell canvas.draw{position:absolute; inset:0; width:100%; height:100%}

/* Sound States cover: live 3D */
.f-ss .hint{color:var(--studio-muted)}
.f-ss .legend{position:absolute; left:14px; bottom:12px; display:flex; gap:12px; z-index:3; font:400 12px var(--mono); color:var(--studio-muted)}
.f-ss .legend b{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px}
.stage{position:absolute; inset:0}
.stage canvas{display:block; width:100%; height:100%}
.loading{position:absolute; inset:0; display:grid; place-items:center; color:var(--studio-muted); font:400 13px var(--mono)}
/* Sound States cover: the sound leads (one song in two states, drawn from the real stems); the two physical pieces sit beside it.
   Each physical cell shows its 3D model until there is a photo of the real piece, then the photo replaces it */
/* 11-15: warm-white gutters, so the cells read as three dark tiles on the page instead of one black slab */
.ss-cover{position:absolute; inset:0; display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:10px; background:var(--bg)}
.sc-phys{display:grid; grid-template-rows:1fr 1fr; gap:10px; min-height:0}
.ss-cover .cell,.bento .cell{border-radius:6px}
.sc-phys .cell{background:transparent}
.f-ss .tag{left:0; top:0} .f-ss .hint{right:0; bottom:0}   /* no frame any more: labels line up with the text below */ .sc-phys .cell .tag{color:var(--studio-ink)} .sc-phys .cell .hint,.sc-phys .sc-credit{color:var(--studio-muted)}
.sc-phys .loading{color:var(--studio-muted)}
.sc-sound{display:grid; place-items:center}
.sc-pair{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:4%; width:84%}
.sc-pair figure{margin:0; text-align:center}
.sc-pair canvas{width:100%; height:auto; aspect-ratio:1; display:block}
.sc-pair figcaption{margin-top:10px; font-size:13px; color:var(--studio-ink); max-width:none}
.sc-to{font-size:22px; color:var(--studio-muted)}
.sc-cell .hint{color:var(--studio-muted)}
.sc-cell img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
@media (max-width:860px){
  .frame.f-ss{aspect-ratio:auto}
  .ss-cover{position:relative; grid-template-columns:1fr}
  .sc-sound{aspect-ratio:16/10}
  .sc-phys{grid-template-rows:none; grid-template-columns:1fr 1fr}
  .sc-cell{aspect-ratio:4/3}
}
@media (max-width:560px){
  .sc-sound{aspect-ratio:auto; padding:52px 0 26px}
  .sc-pair{width:88%}
  .sc-cell{aspect-ratio:1}
  .sc-cell .hint{right:10px; bottom:8px; font-size:11.5px}
  .sc-cell .tag{left:10px; top:10px}
  .sc-credit{display:none}   /* too long for a half-width cell; the credit stays on the project page */
}
/* Radar cover: the product film, silent and looping (media/radar-film-cover.mp4) */
.f-rd{background:#ecebe7 url(media/radar-film-poster.jpg) center/cover no-repeat; border:1px solid var(--rule)}   /* 11-20: the poster stays behind the film for phones that show no video frame */
.frame iframe.film{position:absolute; inset:0; width:100%; height:100%; border:0; pointer-events:none}
.frame video.film{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none}
.f-rd .tag{color:var(--ink)}
.f-rd .hint{color:var(--muted); left:16px; right:auto; top:34px; bottom:auto}   /* under the label: the film's lower right is where the devices pass */
@media (max-width:560px){ .f-rd .hint{display:none} }   /* 11-20: on a phone the second line ran into the laptop in the film */

/* Music cover: until there is audio and footage, just the two songs, set in type (no fake footage).
   It is only as tall as its words, a strip rather than an empty poster; give it the full frame again once there is a real cover */
.f-mu{background:#efe9df; border:1px solid var(--rule)}
.frame.f-mu{aspect-ratio:auto}
.mu-type{position:relative; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; gap:0 6%; padding:clamp(22px,4vw,48px)}
.mu-type .k{grid-column:1 / -1; font-size:13px; color:var(--mu-accent); margin-bottom:clamp(24px,4vw,44px)}
.mu-song b{display:block; font:400 clamp(26px,2.9vw,38px)/1.05 var(--display); letter-spacing:-.02em; color:var(--ink)}
.mu-song span{display:block; margin-top:12px; font-size:14px; color:var(--muted); max-width:34ch}
.mu-song i{display:block; width:42px; height:3px; background:var(--mu-accent); margin-bottom:16px; border-radius:2px}
@media (max-width:560px){
  /* on a phone the two titles stack */
  .mu-type{grid-template-columns:1fr; gap:22px}
  .mu-type .k{margin-bottom:0}
}



/* ---------- project page ---------- */
.proj{display:grid; grid-template-columns:220px minmax(0,1fr); gap:48px; padding-top:28px}
.side{position:sticky; top:calc(env(safe-area-inset-top,0px) + 96px); align-self:start; z-index:15}
.side-panel{display:flex; flex-direction:column; gap:22px}
.side-rail{display:none}
.back{font-size:14px; text-decoration:none; color:var(--w-muted)}
.back:hover{color:var(--w-ink)}
.side h1{margin:0; font:400 30px/1.05 var(--display); letter-spacing:-.01em}
.side .kind{font-size:13.5px; color:var(--w-muted); margin-top:6px}
.secs{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; border-left:1px solid var(--w-rule)}
.secs a{display:block; text-decoration:none; padding:6px 0 6px 16px; margin-left:-1px; border-left:2px solid transparent; color:var(--w-muted)}
.secs a span{display:block; font-size:15px}
.secs a small{display:none; font-size:12.5px; line-height:1.4; color:var(--w-muted); margin-top:2px}
.secs a[aria-current="true"] small{display:block}
.secs a:hover{color:var(--w-ink)}
.secs a[aria-current="true"]{color:var(--w-ink); border-left-color:var(--w-accent)}
.side .links{display:flex; flex-direction:column; gap:6px; font-size:13.5px; padding-top:4px}
.side .links a{color:var(--w-muted)}

.panel{scroll-margin-top:calc(var(--hdr, 88px) + 40px)}   /* lands with the section's own rule tucked under the bar, so there's one line, not two */
.panel + .panel{margin-top:88px; padding-top:44px; border-top:1px solid var(--w-rule)}
.sub-h{margin:44px 0 14px; font-size:18px; font-weight:500}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
details.more{margin-top:14px}
details.more > summary{cursor:pointer; font-size:13.5px; color:var(--w-muted); list-style:none; display:inline-flex; gap:6px; align-items:baseline}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"+"; display:inline-block; width:1ch; color:var(--w-accent)}
details.more[open] > summary::before{content:"−"}
details.more > summary:hover{color:var(--w-ink)}
/* 11-19: a small word says it opens (the + alone was not read as clickable) */
details.more > summary::after{content:"click to open"; font-size:11.5px; color:var(--w-faint); margin-left:4px}
details.more[open] > summary::after{content:"click to close"}
details.more > p{margin-top:10px!important}
/* open/close glides where the browser supports it (Chrome 131+); elsewhere it just snaps open */
details.more{interpolate-size:allow-keywords}
details.more::details-content{block-size:0; overflow:clip; transition:block-size .28s ease, content-visibility .28s allow-discrete}
details.more[open]::details-content{block-size:auto}
@keyframes enter{from{opacity:.001; transform:translateY(8px)}to{opacity:1; transform:none}}
.panel h2{margin:0 0 16px; font:400 30px/1.15 var(--display); letter-spacing:-.01em; text-wrap:balance; max-width:28ch}
.panel p{max-width:62ch; margin:0 0 14px}
.panel .lead{font-size:17px; line-height:1.55}
figure{margin:22px 0 26px}
figure img{display:block; width:100%; border-radius:4px; border:1px solid var(--w-rule)}
.livefig{position:relative; width:100%; overflow:hidden; border-radius:4px; border:1px solid var(--w-rule); background:var(--page); min-height:120px}
.livefig iframe{position:absolute; left:0; top:0; border:0; transform-origin:0 0; display:block}
.fullbtn{font:inherit; font-size:13px; color:var(--w-ink); background:none; border:0; padding:0; margin-left:6px; text-decoration:underline; cursor:pointer}
.fullview{position:fixed; inset:0; z-index:100; background:var(--page); display:flex; flex-direction:column}
.fullview iframe{flex:1; width:100%; border:0}
.fullclose{position:absolute; right:calc(env(safe-area-inset-right,0px) + 16px); top:calc(env(safe-area-inset-top,0px) + 12px); z-index:2; font:inherit; font-size:13px; color:#e7e3da; background:rgba(12,14,20,.8); border:1px solid rgba(231,227,218,.3); border-radius:4px; padding:6px 10px; cursor:pointer}
.liveembed{position:relative; width:100%; border-radius:4px; border:1px solid var(--w-rule); overflow:hidden; background:var(--page)}
.liveembed iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:block}
figcaption{font-size:14px; color:var(--w-muted); margin-top:8px; max-width:70ch}
figcaption b{color:var(--w-ink); font-weight:500}
.slot{border:1px dashed var(--w-rule); border-radius:4px; display:grid; place-items:center; text-align:center; padding:24px; color:var(--w-faint); font:400 12.5px/1.5 var(--mono); aspect-ratio:16/9; max-width:100%}
.slot b{display:block; font:400 18px var(--display); color:var(--w-muted); margin-bottom:4px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:22px 0}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin:22px 0}
.grid2 .slot, .grid3 .slot{aspect-ratio:4/3}
.gdev{grid-template-columns:2.6fr 1fr; align-items:start}
.chapters .live3d{aspect-ratio:4/3}
.chapters{gap:28px}
h3.ch{margin:16px 0 2px; font-size:18px; font-weight:500}
.chmeta{font-size:13px; color:var(--w-muted); margin-bottom:8px}
.chnote{font-size:12.5px; color:var(--w-faint); margin:10px 0 0; max-width:46ch}
#ssPlotMount canvas{cursor:pointer}
.chlead{margin:0 0 10px!important; color:var(--w-ink); max-width:46ch}
a.deep{display:inline-block; font-size:14px; color:var(--w-ink)}
.foot-note{font-size:13.5px; color:var(--w-muted); margin-top:22px!important}
.cmp-wrap{overflow-x:auto; margin:26px 0 8px}
table.cmp{border-collapse:collapse; width:100%; min-width:560px; font-size:13.5px; line-height:1.5}
table.cmp th, table.cmp td{text-align:left; vertical-align:top; padding:10px 12px 10px 0; border-top:1px solid var(--w-rule)}
table.cmp thead th{border-top:0; font-weight:500; color:var(--w-ink); font-size:14px}
table.cmp tbody th{font-weight:400; color:var(--w-accent); width:90px; white-space:nowrap}
table.cmp td{color:var(--w-muted); width:45%}
table.cmp:not(.eng){max-width:980px}   /* two text columns: keep each line readable */
/* Creator Radar page, Nov 14 restructure */
@media (min-width:901px){
  .pair{grid-template-rows:auto auto auto}
  .pair > div{display:grid; grid-row:span 3; grid-template-rows:subgrid; row-gap:0}   /* both columns share rows: titles, text, pictures and captions line up */
  .pair .shot{margin-top:16px}
}
@media (max-width:1100px){ .rk-card-lens{grid-template-columns:minmax(0,1fr)!important; gap:14px!important} }

.rk-card-foot{font-size:13px; color:var(--w-muted); margin:14px 0 0!important; padding-top:12px; border-top:1px solid var(--w-rule); max-width:none!important} .rk-card-foot b{color:var(--w-ink); font-weight:500}
.pair .shot img{aspect-ratio:16 / 10; object-fit:cover; object-position:top}   /* both pictures in one frame size, so the captions line up */
.vs{list-style:none; margin:4px 0 0; padding:0; font-size:15px; line-height:1.5; color:var(--w-muted)}
.vs li{display:grid; grid-template-columns:84px minmax(0,1fr); gap:12px; padding:9px 0; border-top:1px solid var(--w-rule)} .vs li:first-child{border-top:0; padding-top:0}
.vs b{font-weight:500; color:var(--w-ink)}
.chat-row .duo{align-items:start}

.pair{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:48px; align-items:start; margin-top:30px; padding-top:22px; border-top:1px solid var(--w-rule)}
.pair .idea-h{margin-top:0} .pair p{max-width:none!important} .pair .shot{margin-top:16px}
.chat-row{margin-top:34px; padding-top:18px} .chat-row .idea-h{font-size:16px} .chat-row > p{margin-bottom:4px!important; font-size:15px; color:var(--w-muted)}
.more-row{display:flex; flex-wrap:wrap; gap:6px 24px; margin-top:6px!important}
.more-btn{background:none; border:0; padding:0; cursor:pointer; font:inherit; font-size:13.5px; color:var(--w-muted); display:inline-flex; gap:6px; align-items:baseline}
.more-btn::before{content:"+"; display:inline-block; width:1ch; color:var(--w-accent)} .more-btn[aria-expanded="true"]::before{content:"−"}
.more-btn:hover{color:var(--w-ink)} .more-btn:focus-visible{outline:2px solid var(--focus); outline-offset:3px; border-radius:2px}
.more-panel{margin-top:10px}
.eng3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; background:#fff; border:1px solid var(--w-rule); border-radius:8px; padding:16px 18px}
.eng3 small{display:block; font-size:12.5px; font-weight:500; padding-bottom:6px; margin-bottom:8px; border-bottom:2px solid}
.eng3 .c small{color:#b4441f; border-color:#b4441f} .eng3 .e small{color:var(--w-ink); border-color:var(--w-ink)} .eng3 .p small{color:#1f5e7e; border-color:#1f5e7e}

.ptl li{display:grid; grid-template-columns:90px minmax(0,1fr) minmax(0,1.3fr); gap:20px; align-items:start; padding-top:18px; border-top:1px solid var(--w-rule)}
.ptl .when{font-size:13px; color:var(--w-muted); padding-top:2px; font-variant-numeric:tabular-nums}
.ptl .what b{display:block; font-size:15.5px; font-weight:500; margin-bottom:4px}
.ptl .what p{font-size:15px; color:var(--w-muted); margin:0!important}
.ptl .media img{border-radius:4px; border:1px solid var(--w-rule); display:block; width:100%}
.ptl .media .slot{aspect-ratio:16/9}
.ibi{border:1px solid var(--w-rule); border-radius:4px; padding:10px 10px 8px}
.ibi canvas{width:100%; height:auto; display:block}
.ibi-k{display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--w-muted); margin-top:6px}
.ibi-k i{display:inline-block; width:10px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle}
.ibi-k .ibi-src{margin-left:auto; color:var(--w-faint)}
@media (max-width:860px){ .ptl li{grid-template-columns:1fr; gap:8px} }







/* project pages: one sticky bar of section tabs; content always full width */
.proj{display:block!important; padding-top:8px}
.ptabs{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--hdr, 88px)); z-index:15; background:var(--page); display:flex; align-items:center; gap:10px 26px; padding:10px 0; border-bottom:1px solid var(--w-rule); margin-bottom:30px}
.pt-back{text-decoration:none; color:var(--w-muted); font-size:14px; white-space:nowrap}
.pt-back span{color:var(--w-ink); font-weight:500; font-size:15px; margin-left:4px}
.pt-back:hover span{text-decoration:underline}
.pt-list{list-style:none; margin:0; padding:0; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; flex:1}
.pt-list::-webkit-scrollbar{display:none}
.pt-list a{display:block; text-decoration:none; color:var(--w-muted); font-size:13.5px; padding:5px 11px; border-radius:999px; white-space:nowrap}
.pt-list a:hover{color:var(--w-ink)}
.pt-list a[aria-current="true"]{color:var(--w-ink); background:rgba(127,127,127,.14)}
.pt-links{display:flex; gap:16px; font-size:13.5px; white-space:nowrap}
.pt-links a{color:var(--w-muted)}
.pt-links-m{display:none}
@media (max-width:560px){
  /* phone: only the section bar stays on screen; the site header scrolls away, the outside links move into the page */
  .site{position:static}
  .ptabs{top:env(safe-area-inset-top,0px); flex-wrap:nowrap!important; gap:4px!important; padding:8px 0; margin-bottom:18px}
  .pt-back span{display:none}
  .pt-back{font-size:18px; padding:0 8px 0 2px}
  .pt-list{order:0!important; flex-basis:auto!important; -webkit-mask-image:linear-gradient(90deg,#000 82%,transparent); mask-image:linear-gradient(90deg,#000 82%,transparent); padding-right:28px}
  .pt-links{display:none!important}
  .pt-links-m{display:flex; gap:18px; font-size:14px; margin:0 0 22px}
  .pt-links-m a{color:var(--w-muted)}
  .panel{scroll-margin-top:30px}
}
@media (max-width:860px){
  .ptabs{flex-wrap:wrap; gap:6px 14px}
  .pt-list{order:3; flex-basis:100%}
  .pt-links{margin-left:auto}
}

.two-radars{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:28px; margin-top:26px}

.cm .pm-k::before{background:#b4441f} .cm .pm-hot .hb i{background:#b4441f} .cm .pm-hot .hv{color:#b4441f}

.pm-hot div{grid-template-columns:96px 1fr 32px!important}
.rr ul{margin:10px 0 14px; padding-left:18px; font-size:13.5px; color:var(--w-ink)} .rr li{margin:4px 0}

@media (max-width:860px){
  .site{grid-template-columns:1fr; justify-items:center; gap:10px; padding-block:18px 14px}

  .secs a small{display:none}
  .secs a[aria-current="true"]{border-bottom-color:var(--w-accent)}
  .side .links{flex-direction:row; flex-wrap:wrap; gap:12px}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .about{grid-template-columns:1fr} .about .slot{position:static; max-width:420px}
  .f-ss .legend{display:none}
}
@media (max-width:480px){ .grid2,.grid3{grid-template-columns:1fr} }
@media (max-width:700px){
  .nfig-scroll svg, .diagram svg{min-width:0}
  .nfig-scroll svg{max-width:480px}   /* drawn at phone size; don't blow it up on a small tablet */
  .cmp-wrap{overflow:visible}
  table.cmp, table.cmp tbody, table.cmp tr, table.cmp th, table.cmp td{display:block; width:auto!important; min-width:0}
  table.cmp thead{display:none}
  table.cmp tr{padding:12px 0 6px; border-top:1px solid var(--w-rule)}
  table.cmp th, table.cmp td{border-top:0; padding:3px 0}
  table.cmp tbody th{font-weight:500; white-space:normal; margin-bottom:2px}
  table.cmp td::before{content:attr(data-label); display:block; font-size:12px; color:var(--w-faint)}
  table.cmp.eng{border-spacing:0}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} .slides img:first-child{opacity:1} }

/* "System at a glance": the five-state table as real page content (constants verbatim from script.js) */

    let sh; if (k === 'focus') sh = `<circle cx="${m}" cy="${m}" r="${r0}" fill="${rgb(c, .75)}"/>`;

    return `<div class="st-r${g ? ' g' : ''}"><span class="st-bar" style="background:${rgb(c, g ? .6 : null)}"></span>

  return `<section class="st6 dk" aria-label="System at a glance">

    <p>The disc <b>suggests</b> a state from what you report — sectors follow Russell's angles, the centre (settled) suggests Work — and <b>you choose</b>. Inside the state you choose, heart rate read against <b>your own baseline</b> tells it how far you are from its goal, and <b>each state answers in its own way</b>: the same heartbeat means something different in Relax than in Motion. Tense or low falls in the <b>guide zone</b>: no board is forced; you pick a strategy. Every cell comes from the shipping code. The highlights all beat with one resting heart (60 BPM): one body, read differently by each state.</p>

/* "Same song, separate layers": the gain curves over openness, drawn straight into the page (same curves as script.js stemGainFor).
   In Relax, heart rate doesn't set openness directly: the guide matches you, then leads openness down to a calm landing (fact sheet K2). */

const narrow = () => matchMedia('(max-width:700px)').matches;
const stemGeom = () => narrow() ? { VW: 380, H: 300, X0: 40, X1: 365, YT: 44, YB: 236 } : { VW: 1040, H: 360, X0: 64, X1: 1010, YT: 46, YB: 316 };
function stemChart() {

  const lay = [['piano', P, 'Piano · floor, nearly constant'], ['bass', Bs, 'Bass · rises through the middle'], ['strings', St, 'Strings · bound tightest']];
  const L = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  return `<section class="nfig dk" aria-label="Layer gain curves">
    <h3>Same song: with stems, Relax can change the composition. A whole track can only change its presentation.<span class="listen-tag">${L}press Listen to hear it</span></h3>
    <p>The Relax board splits one song into three layers, each on its own curve: <b>piano nearly constant</b>, <b>bass rising through the middle</b>, <b>strings bound tightest</b>. Openness decides how many play. Heart rate doesn't set it directly: you chose Relax, so you want calm. The system first <b>meets you where you are</b> (a racing heart starts with a fuller mix), then over a minute or two <b>guides openness down to a calm landing</b>, slowing down if your heart rate keeps climbing. Matching first is what keeps people listening; the guided ending is what calms them (Lowe-Brown et al., 2026; Ding et al., 2026).</p>
    <div class="stem-wrap">

        <circle cx="${xOf(STEM_CALM)}" cy="${yOf(strings(STEM_CALM))}" r="6" fill="none" stroke="${St}" stroke-width="2.2"/>
        <text x="${xOf(STEM_CALM) + 16}" y="${yOf(strings(STEM_CALM)) + 30}" fill="${St}" font-size="14">${n ? 'strings pulled back' : 'calm landing · strings pulled well back'}</text>

let ac = null, soundOn = false;
const sndBtn = document.getElementById('snd'), sndLabel = document.getElementById('sndLabel');

  try { localStorage.setItem('xz-sound', on ? '1' : '0'); } catch (e) {}
}
sndBtn.addEventListener('click', () => {

  if (ac.state === 'suspended') ac.resume();

});

  o.start(t0); o.stop(t0 + dur + .05);

  s.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.4; f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t0 + dur * .6); g.gain.linearRampToValueAtTime(0, t0 + dur);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t0);
}
let lastCue = 0;
function cue(kind) {
  if (!soundOn || !ac) return;
  const t = ac.currentTime + .01;
  if (kind === 'ss') { tone(220, t, 1.6, 'sine', .05, .25); tone(329.6, t + .05, 1.6, 'sine', .035, .3); tone(440, t + .1, 1.4, 'triangle', .015, .3); }
  if (kind === 'rd') { [1046.5, 1318.5, 1568].forEach((f, i) => tone(f, t + i * .07, .09, 'square', .018)); }
  if (kind === 'mu') { [293.7, 370, 440, 554.4].forEach((f, i) => tone(f, t + i * .09, .7, 'triangle', .045)); }
  if (kind === 'enter') noise(t, .55, 300, 3200, .06);
  if (kind === 'back') noise(t, .45, 2400, 260, .05);

/* the section bar follows the scroll: the section nearest the top is current, and the address follows it without a reload */
let spy = null;
function setCurrent(id, k, write) {
  document.querySelectorAll('.pt-list a').forEach(a => a.setAttribute('aria-current', a.hash === `#${id}-${k}`));
  document.querySelector('.pt-list a[aria-current="true"]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  if (write && location.hash !== `#${id}-${k}`) { history.replaceState(null, '', `#${id}-${k}`); prev = `${id}-${k}`; }
}
function spyOn(id) {
  spy?.disconnect();
  const secs = [...app.querySelectorAll('section.panel')]; if (!secs.length) return;
  const seen = new Map();
  spy = new IntersectionObserver(es => {
    es.forEach(e => seen.set(e.target, e.isIntersecting));
    if (Date.now() < spyQuiet) return;   // a tab click is scrolling us; let it land first
    const vis = secs.filter(s => seen.get(s)); if (vis.length) setCurrent(id, vis[0].dataset.sec, true);
  }, { rootMargin: '-30% 0px -60% 0px' });
  secs.forEach(s => spy.observe(s));
}
let spyQuiet = 0;
function goSection(id, k, smooth) {
  const el = document.getElementById('sec-' + k); if (!el) return;
  spyQuiet = Date.now() + (smooth ? 900 : 200); setCurrent(id, k, false);
  // land with the section's top rule just under the sticky bar (its height changes with the screen width)
  const bar = document.querySelector('.ptabs'), stuck = parseFloat(getComputedStyle(bar).top) || 0;
  scrollTo({ top: el.getBoundingClientRect().top + scrollY - stuck - bar.offsetHeight + 1, behavior: smooth ? 'smooth' : 'auto' });
}

const FIG_W = 1360;
function liveFigs(root) {
  root.querySelectorAll('.livefig').forEach(box => {
    if (box.dataset.ready) return; box.dataset.ready = 1;
    const f = document.createElement('iframe'); f.src = box.dataset.src; f.title = box.getAttribute('aria-label') || 'figure';
    f.setAttribute('scrolling', 'no'); f.style.width = FIG_W + 'px'; f.loading = 'lazy'; box.appendChild(f);
    const fit = () => { const doc = f.contentDocument; if (!doc || !doc.body) return;
      const h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight), k = box.clientWidth / FIG_W;
      f.style.height = h + 'px'; f.style.transform = `scale(${k})`; box.style.height = (h * k) + 'px'; };
    f.addEventListener('load', () => { fit(); setTimeout(fit, 600); setTimeout(fit, 2000); });
    new ResizeObserver(fit).observe(box);
  });
}
function liveEmbeds(root) {
  root.querySelectorAll('.liveembed').forEach(box => {
    if (box.dataset.ready) return; box.dataset.ready = 1;
    const f = document.createElement('iframe'); f.src = box.dataset.src; f.title = box.getAttribute('aria-label') || 'embedded page';
    f.setAttribute('allow', 'autoplay'); f.loading = 'lazy'; box.appendChild(f);
    const ratio = box.dataset.ratio;
    const fit = () => {
      if (ratio !== 'auto') { box.style.height = Math.max(420, box.clientWidth * +ratio) + 'px'; return; }
      const doc = f.contentDocument; if (!doc || !doc.body) return;
      box.style.height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight) + 'px';
    };
    fit(); f.addEventListener('load', () => { fit(); setTimeout(fit, 800); setTimeout(fit, 2500); });
    new ResizeObserver(fit).observe(box);
  });
}
function openFull(src) {

  const close = () => { ov.remove(); removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  const onKey = e => { if (e.key === 'Escape') close(); };
  ov.querySelector('.fullclose').onclick = close; addEventListener('keydown', onKey);
  document.body.appendChild(ov); document.body.style.overflow = 'hidden'; ov.querySelector('.fullclose').focus();
}

/* router: #ss-anatomy, #rd-experience, #about … (bare tokens only) */
let prev = '';
function route() {
  playing?.stop();   // any excerpt stops when the view changes
  const h = location.hash.slice(1), m = h.match(/^(ss|rd|mu)(?:-(\w+))?$/);
  const wasProj = /^(ss|rd|mu)/.test(prev);
  if (m) {
    const open = secsOf(m[1]);
    if (!open.length) { location.replace('#'); return; }
    const sec = open.some(s => s[0] === m[2]) ? m[2] : open[0][0];
    const sameProj = prev.split('-')[0] === m[1] && document.getElementById('sec-' + sec);
    cue(sameProj ? 'tab' : 'enter');
    if (sameProj) goSection(m[1], sec, true);   // same project: scroll to that section, no re-render
    else { project(m[1], sec); if (sec === open[0][0]) scrollTo({ top: 0 }); else requestAnimationFrame(() => goSection(m[1], sec, false)); }   // a deep link lands on its section
  } else if (h === 'about' || h === 'cv' || h === 'about-contact') {
    spy?.disconnect();
    if (!/^(about|cv)/.test(prev)) about();
    const el = h === 'about' ? null : document.getElementById(h);   // #cv and #about-contact land on their part of the About page
    scrollTo({ top: el ? el.getBoundingClientRect().top + scrollY - (document.querySelector('.site')?.offsetHeight || 0) - 16 : 0, behavior: el && /^(about|cv)/.test(prev) ? 'smooth' : 'auto' });
  }
  else { spy?.disconnect(); if (wasProj) cue('back'); home(); }
  prev = h;
}
